# k8s-rca.sh configuration (sourced as bash). CLI flags override these values.
# Use --config FILE or K8S_RCA_CONFIG=FILE to point at another file.

# ---- collection
LOG_TAIL=500                 # lines per container (current + previous)
REQUEST_TIMEOUT=30           # seconds, passed to kubectl --request-timeout
COLLECT_LOGS=true
COLLECT_METRICS=true         # kubectl top (metrics-server) when available

# ---- triage
RESTART_THRESHOLD=3          # restarts at/above this mark a pod unhealthy
MAX_PODS=25                  # max pods drilled into per deployment/namespace/cluster run

# ---- rule thresholds
MEMORY_USAGE_WARN_PCT=90
CPU_USAGE_WARN_PCT=90
QUOTA_WARN_PCT=90
CERT_EXPIRY_WARN_DAYS=14

# ---- reporting
MIN_CONFIDENCE=0
MAX_EVIDENCE=5               # max log lines quoted per finding
REDACT_PATTERNS=()           # extra ERE patterns to scrub, e.g. ('ACME-[0-9]{6}')

# ---- rules
DISABLED_RULES=()            # rule IDs or function names, e.g. (K8S-RES-001 rule_pod_dns)
EXTRA_RULE_DIRS=()           # extra directories with *.sh rule files
SEVERITY_OVERRIDES=()        # e.g. ("K8S-NET-003=LOW")
